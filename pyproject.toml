[project]
name = "pyga"
version = "0.1.0"
description = "Um clone simples de Pong feito com pygame"
readme = "README.md"
authors = [
    { name = "Kheven Colino", email = "kneves@ciandt.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "ruff>=0.17.5",
]

[project.scripts]
pyga = "pyga:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
